<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopEase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="minimal-style.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn-back-to-shop {
            transition: all 0.3s ease;
            transform-origin: left center;
        }
        .btn-back-to-shop:hover {
            transform: translateX(-5px);
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
            background-color: #6C757D;
        }
        .btn-back-to-shop i {
            transition: transform 0.3s ease;
        }
        .btn-back-to-shop:hover i {
            transform: translateX(-3px);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo-link">
                <span class="logo-icon">🛍️</span>
                <span class="logo-text">ShopEase</span>
            </a>
            <h1>Checkout</h1>
        </div>
    </header>
    <div class="container mt-3 mb-4">
        <a href="shop.html" class="btn btn-outline-secondary btn-back-to-shop">
            <i class="fas fa-arrow-left me-2"></i>Back to Shop
        </a>
    </div>
    <div class="warning">
        <div style="position: fixed;width: 100%;z-index: 100;display: none;" id="warning" class="alert alert-warning">warning! you can't checkout without adding products to the cart</div>
    </div>

    <main class="checkout-container">
        <div class="container">
            
            <div class="checkout-grid">
                <!-- Checkout Form -->
                <div class="checkout-form">
                    <h2>Shipping Information</h2>
                    <form id="checkoutForm" class="form">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" name="fullName" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="address">Street Address</label>
                            <input type="text" id="address" name="address" required>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City</label>
                                <input type="text" id="city" name="city" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="postalCode">Postal Code</label>
                                <input type="text" id="postalCode" name="postalCode" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="country">Country</label>
                            <select id="country" name="country" required>
                                <option value="">Select Country</option>
                                <option value="US">United States</option>
                                <option value="UK">United Kingdom</option>
                                <option value="CA">Canada</option>
                                <option value="AU">Australia</option>
                                <!-- Add more countries as needed -->
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="shippingMethod">Shipping Method</label>
                            <div class="shipping-methods">
                                <label class="shipping-option">
                                    <input onclick="shippingPrice(this.id)" id="long" type="radio" name="shippingMethod" value="standard" required>
                                    <span class="shipping-details">
                                        <span class="shipping-name">Standard Shipping</span>
                                        <span  class="shipping-price">$5.99</span>
                                        <span class="shipping-time">3-5 business days</span>
                                    </span>
                                </label>
                                <label class="shipping-option">
                                    <input onclick="shippingPrice(this.id)" id="short" type="radio" name="shippingMethod" value="express" required>
                                    <span class="shipping-details">
                                        <span class="shipping-name">Express Shipping</span>
                                        <span  class="shipping-price">$12.99</span>
                                        <span class="shipping-time">1-2 business days</span>
                                    </span>
                                </label>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="notes">Order Notes (Optional)</label>
                            <textarea id="notes" name="notes" rows="3" placeholder="Notes about your order, e.g. special delivery instructions"></textarea>
                        </div>
                    </form>
                </div>
                
                <!-- Order Summary -->
                <div class="order-summary">
                    <h2>Your Order</h2>
                    <div class="order-grid" id="orderGrid">
                        
                    </div>
                    
                    
                    <div class="order-totals">
                        <div class="total-row">
                            <span>Subtotal</span>
                            <span id="subtotal"></span>
                        </div>
                        <div class="total-row">
                            <span>Shipping</span>
                            <span id="shipping"></span>
                        </div>
                        <div class="total-row grand-total">
                            <span>Total</span>
                            <span id="total"></span>
                        </div>
                    </div>
                    
                    <div class="payment-methods">
                        <h3>Payment Method</h3>
                        <div class="payment-options">
                            <label class="payment-option">
                                <input type="radio" name="paymentMethod" value="creditCard" checked>
                                <i class="fas fa-credit-card"></i>
                                <span>Credit Card</span>
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="paymentMethod" value="paypal">
                                <i class="fab fa-paypal"></i>
                                <span>PayPal</span>
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="paymentMethod" value="cash">
                                <i class="fas fa-money-bill-wave"></i>
                                <span>Cash on Delivery</span>
                            </label>
                        </div>
                        
                        <div id="creditCardForm" class="credit-card-form" style="display: block;">
                            <div class="form-group">
                                <label for="cardNumber">Card Number</label>
                                <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="expiryDate">Expiry Date</label>
                                    <input type="text" id="expiryDate" placeholder="MM/YY">
                                </div>
                                <div class="form-group">
                                    <label for="cvv">CVV</label>
                                    <input type="text" id="cvv" placeholder="123">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="cardName">Name on Card</label>
                                <input type="text" id="cardName" placeholder="John Doe">
                            </div>
                        </div>
                        
                        <button id="placeOrderBtn" type="submit" form="checkoutForm" class="btn btn-primary btn-block">
                            Place Order
                        </button>
                        
                        <p class="secure-checkout">
                            <i class="fas fa-lock"></i> Secure Checkout
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    

    
    


    <footer class="footer">
        <div class="container">
            <p>&copy; 2023 ShopEase. All rights reserved.</p>
        </div>
    </footer>
    <script src="main.js"></script>
    <!-- JavaScript removed as per user request -->
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
